name: Build K222 APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/k222-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: Name APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk K222.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K222-APK
          path: K222.apk
          if-no-files-found: error
